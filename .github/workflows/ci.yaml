name: 💚 Integration

on: 
  pull_request:
    branches: 
      - main
      - development

jobs:
  integration: 
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🛫 Golang setup
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: 📦 Download modules
        run: go mod download

      - name: 🔍 Vet
        run: go vet ./... 

      - name: 💅 Check formatting
        run: if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then exit 1; fi

      - name: 🔍 Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9

      - name: 🌐 Install Chromium
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which
      # breaks Chromium's sandbox on CI ("No usable sandbox!"). See Chrome's docs:
      # https://chromium.googlesource.com/chromium/src/+/main/docs/security/apparmor-userns-restrictions.md
      - name: 🔓 Disable AppArmor user namespace restriction
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: 🧪 Test
        run: make test
        env:
          CHROMIUM_BINARY_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}